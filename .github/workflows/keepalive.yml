name: Keep API awake

# Render free services spin down after ~15 minutes without inbound traffic,
# which also pauses the in-process scheduler: predictions go stale and the
# first visitor waits ~50s for a cold start.
#
# A scheduled workflow is used instead of an external uptime monitor because it
# needs no extra account, lives with the code, and is free for public repos.
#
# Accepted limits: GitHub delays scheduled runs under load, so the service will
# occasionally sleep anyway (the app degrades honestly when it does), and
# schedules are disabled after 60 days of repo inactivity.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and assert it is healthy
        run: |
          URL="https://phatak-api.onrender.com/health/live"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -fsS -o /tmp/body.json -w '%{http_code}' --max-time 60 "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "awake on attempt $attempt:"; cat /tmp/body.json; exit 0
            fi
            echo "attempt $attempt returned $code; retrying in 15s"
            sleep 15
          done
          echo "::warning::API did not respond healthy after 6 attempts"
          exit 1
